name: Утренний сбор данных

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC = 06:00 МСК (Actions может опаздывать)
  workflow_dispatch:       # ручной запуск кнопкой

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Сбор данных
        env:
          OZON_MECO_CLIENT_ID: ${{ secrets.OZON_MECO_CLIENT_ID }}
          OZON_MECO_API_KEY: ${{ secrets.OZON_MECO_API_KEY }}
          OZON_MECO_PERF_CLIENT_ID: ${{ secrets.OZON_MECO_PERF_CLIENT_ID }}
          OZON_MECO_PERF_SECRET: ${{ secrets.OZON_MECO_PERF_SECRET }}
          OZON_BS_CLIENT_ID: ${{ secrets.OZON_BS_CLIENT_ID }}
          OZON_BS_API_KEY: ${{ secrets.OZON_BS_API_KEY }}
          OZON_BS_PERF_CLIENT_ID: ${{ secrets.OZON_BS_PERF_CLIENT_ID }}
          OZON_BS_PERF_SECRET: ${{ secrets.OZON_BS_PERF_SECRET }}
          WB_BS_TOKEN: ${{ secrets.WB_BS_TOKEN }}
          YM_BS_API_KEY: ${{ secrets.YM_BS_API_KEY }}
          YM_BS_CAMPAIGN_ID: ${{ secrets.YM_BS_CAMPAIGN_ID }}
          YM_BS_BUSINESS_ID: ${{ secrets.YM_BS_BUSINESS_ID }}
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python main.py
